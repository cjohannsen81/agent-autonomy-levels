# Support agent, refund scope. At L3 every refund is confirmed by an agent lead before it runs;
# AL-10 caps the amount per refund and AL-09 the number per hour. Demoted if CSAT or the
# reopen rate crosses the threshold in the policy, which is what Klarna's reversal in 2025 lacked.
framework_version: 0.2.0
certificate: support-agent/refunds
level: L3
max_level: L3
score: 8
owner: support-lead@example.com
scope:
  identity: svc-support-agent-refunds@example.com
  domains: [ticketing, orders, payments]
  writes: [payments__refund_within_cap]
controls:
  in_place: [AL-01, AL-02, AL-03, AL-04, AL-06, AL-07, AL-08, AL-09, AL-10, AL-11, AL-12, AL-13, AL-17]
  enforcement: aggrete 0.11
  policy: policies/support-agent.refunds.yaml
  verification_report: reports/support-conformance-2026-10-01.md
  approvals_owner: support-team-lead@example.com
evidence:
  - reports/support-refunds-shadow-mode-2026-09.md
issued: 2026-10-01
expires: 2027-01-01
reviewer: security-architecture@example.com
demotion_triggers: [audit_integrity_failure, tool_change, refusal_spike, incident, certificate_expired, material_change]
material_changes: [model_version, new_tool, scope_widened, approval_gate_removed, policy_change]

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema pytest
      - name: Unit tests
        working-directory: tools
        run: python -m pytest -q
      - name: Validate example certificate
        run: python tools/validate.py templates/certificate.example.yaml
